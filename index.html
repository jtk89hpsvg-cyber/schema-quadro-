<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schema Quadro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Schema Quadro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: editor a schermo intero. Barra in alto, area di lavoro SVG al centro, dock con gli strumenti in basso, pannelli che salgono dal basso. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#1b2127; --muted:#5d6975; --line:#d3d9df;
  --ws:#e3e8ed; --dot:#b3bdc7; --accent:#0a62c9; --accent-ink:#ffffff; --danger:#c62f2a;
  --dev:#f6f7f8; --dev-s:#7e8a96; --screw:#cdd3d9; --rail:#b4bcc4; --dev-ink:#1b2127; --sel:#0a62c9;
  --shadow:0 8px 28px rgba(15,25,35,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1317; --panel:#1a2026; --ink:#e8edf1; --muted:#98a4af; --line:#2c353d;
  --ws:#161b20; --dot:#2f3a44; --accent:#4c9bff; --accent-ink:#06121f; --danger:#ff6b63;
  --dev:#e9edf0; --dev-s:#6b7783; --screw:#c3cad1; --rail:#6f7a85; --dev-ink:#1b2127; --sel:#4c9bff;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1317; --panel:#1a2026; --ink:#e8edf1; --muted:#98a4af; --line:#2c353d;
  --ws:#161b20; --dot:#2f3a44; --accent:#4c9bff; --accent-ink:#06121f; --danger:#ff6b63;
  --dev:#e9edf0; --dev-s:#6b7783; --screw:#c3cad1; --rail:#6f7a85; --dev-ink:#1b2127; --sel:#4c9bff;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
.top,.dock{display:flex;gap:8px;align-items:center}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);
  font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ico{width:44px;padding:0}
.btn[disabled]{opacity:.4;cursor:default}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.name{flex:1;min-width:0;justify-content:flex-start;overflow:hidden}
.name span{overflow:hidden;text-overflow:ellipsis}
.dock .btn{flex:1;min-width:0;padding:0 1px;flex-direction:column;gap:2px;font-size:10px;letter-spacing:-.1px;min-height:52px}
.dock .lbl{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wiz{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;justify-content:center;box-sizing:border-box;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wz{width:100%;max-width:640px;display:flex;flex-direction:column;gap:12px;min-height:0}
.wz-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wz-h b{font-size:18px}
.wz-p{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.wz-p i{display:block;height:100%;background:var(--accent)}
.wz-b{flex:1;min-height:0;overflow:auto}
.wz-b p{margin:0 0 10px}
.wz-f{display:flex;justify-content:space-between;gap:8px}
.wz-f .btn{min-width:130px}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.wrow small{display:block;font-size:12px;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.seg .btn{flex:1}
.lr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.lr .num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.lr .inp{flex:1 1 140px}
.lr .sel{flex:0 0 88px;appearance:auto}
.cab{color:var(--muted);min-width:64px;font-variant-numeric:tabular-nums}
.flow{fill:none;stroke:#fff6a8;stroke-width:2;stroke-dasharray:3 12;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.flow{animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}}
.ring{fill:rgba(76,155,255,.18);stroke:var(--accent);stroke-width:3}
@media (prefers-reduced-motion:no-preference){.ring{animation:ringp 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ringp{50%{transform:scale(1.25)}}}
.exbar{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.exbar .exh{display:flex;align-items:center;gap:8px}
.exbar .exb{display:flex;gap:8px;flex-wrap:wrap}
.exbar .hint{font-size:13px;line-height:1.35}
.exbar ul{margin:2px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.simmsg{flex-basis:100%;font-size:13px;color:var(--muted)}
.simmsg.bad{color:var(--danger);font-weight:600}
.note{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13px;color:var(--muted)}
.stage{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--ws)}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.float{position:absolute;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);z-index:5}
.float.topf{top:8px}.float.botf{bottom:8px}
.float .grow{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{color:var(--muted);font-size:13px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer;position:relative}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.sw.yg{background:repeating-linear-gradient(45deg,#e3c000 0 6px,#179a3a 6px 12px)}
.thk{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;padding:0}
.thk i{display:block;width:20px;background:var(--ink);border-radius:2px}
.thk.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0 auto;max-width:680px;max-height:52%;overflow:auto;box-sizing:border-box;
  background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:var(--shadow);
  padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:sticky;top:-14px;background:var(--panel);padding:2px 0 6px;z-index:2}
.sh h2{flex:1;margin:0;font-size:17px}
h3{margin:16px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;min-width:0}
.tile svg{width:100%;height:64px}
.tile span{font-size:12px;text-align:center;line-height:1.2}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row>label{min-width:84px;color:var(--muted);font-size:13px}
.inp{flex:1;min-width:0;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);box-sizing:border-box}
textarea.inp{padding:10px 12px;min-height:110px;width:100%;font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.item.cur{border-color:var(--accent)}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;background:none;border:0;padding:8px 0;font-weight:600;cursor:pointer}
.item small{color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:600}
.ovl{position:fixed;inset:0;z-index:40;background:rgba(8,12,16,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.ovl .card{background:var(--panel);border-radius:16px;padding:14px;max-width:min(92vw,900px);max-height:88vh;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.ovl img{max-width:100%;max-height:60vh;object-fit:contain;background:#fff;border-radius:8px;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:8;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.4}}}
</style>
</head>
<body>

<div class="top">
  <button id="bName" class="btn name" aria-label="Progetto e menu"></button>
  <button id="bUndo" class="btn ico" aria-label="Annulla"></button>
  <button id="bMenu" class="btn ico" aria-label="Menu"></button>
</div>
<div class="stage" id="stage">
  <svg id="cv" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Area di lavoro del quadro elettrico">
    <defs><pattern id="gp" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1.1" style="fill:var(--dot)"/></pattern></defs>
    <rect id="gr" width="100%" height="100%" fill="url(#gp)"/>
    <g id="world"></g>
  </svg>
  <div id="wirebar" class="float topf" hidden></div>
  <div id="simbar" class="float topf" hidden></div>
  <div id="selbar" class="float botf" hidden></div>
  <div id="toast" class="toast" hidden></div>
</div>
<div id="exbar" class="exbar" hidden></div>
<div class="dock">
  <button id="bSel" class="btn" aria-label="Seleziona e sposta"></button>
  <button id="bWire" class="btn" aria-label="Posa cavi"></button>
  <button id="bAdd" class="btn" aria-label="Aggiungi componenti"></button>
  <button id="bGuide" class="btn" aria-label="Guida all'impianto"></button>
  <button id="bFit" class="btn" aria-label="Adatta la vista"></button>
  <button id="bGrid" class="btn" aria-label="Griglia"></button>
</div>
<div id="wiz" class="wiz" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<div id="ovl" class="ovl" hidden></div>

<script>
(function(){
'use strict';
var MOD=36, DH=140, RH=36, GRID=18;
var PAL={'--dev':'#f6f7f8','--dev-s':'#7e8a96','--screw':'#cdd3d9','--rail':'#b4bcc4','--dev-ink':'#1b2127','--sel':'#0a62c9','--ink':'#1b2127','--ws':'#ffffff','--dot':'#ffffff','--muted':'#5d6975'};
var WCOL={r:['Rosso','#d93a35'],k:['Nero','#1f2328'],m:['Marrone','#8a5a2b'],g:['Grigio','#8b949e'],b:['Blu','#1f6fd6'],o:['Arancio','#ef8a17'],y:['Giallo-verde','#e3c000']};
var BC={red:'#d8362f',green:'#1f9d4c',blue:'#1f6fd6',orange:'#ef8a17',yellow:'#e3c000',black:'#2b2f33',grey:'#8b949e'};
var BCN={red:'Rosso',green:'Verde',blue:'Blu',orange:'Arancio',yellow:'Giallo',black:'Nero',grey:'Grigio'};
var CAT={
  mcb1:{name:'Magnetotermico 1P',m:1,p:1,kind:'mcb',label:'C16'},
  mcb2:{name:'Magnetotermico 2P',m:2,p:2,kind:'mcb',label:'C16'},
  mcb3:{name:'Magnetotermico 3P',m:3,p:3,kind:'mcb',label:'C16'},
  mcb4:{name:'Magnetotermico 4P',m:4,p:4,kind:'mcb',label:'C16'},
  rcd2:{name:'Differenziale 2P',m:2,p:2,kind:'rcd',label:'30mA A'},
  rcd4:{name:'Differenziale 4P',m:4,p:4,kind:'rcd',label:'30mA A'},
  rcbo:{name:'Magnetotermico diff.',m:2,p:2,kind:'rcbo',label:'C16 30mA'},
  spd:{name:'Scaricatore SPD',m:2,p:2,kind:'spd',label:'T2',band:'orange'},
  iso:{name:'Sezionatore',m:2,p:2,kind:'iso',label:'40A',band:'grey'},
  cont:{name:'Contattore',m:2,p:2,kind:'cont',label:'25A',band:'black'},
  pulse:{name:'Relè a impulsi',m:1,p:1,kind:'relay',label:'16A',band:'grey'},
  timer:{name:'Relè temporizzatore',m:1,p:1,kind:'relay',label:'T',band:'grey'},
  lamp:{name:'Spia luminosa',m:1,p:1,kind:'lamp',label:''},
  meter:{name:'Contatore energia',m:4,p:2,kind:'meter',label:'kWh'}
};
var LIB=[
  ['Protezioni',['mcb1','mcb2','mcb3','mcb4','rcd2','rcd4','rcbo','spd']],
  ['Comando e misura',['iso','cont','pulse','timer','lamp','meter']],
  ['Guide, barre e morsetti',['din','bar_n','bar_pe','bar_l','comb']],
  ['Alimentazione e carichi',['grid','load']],
  ['Testo',['text']]
];
var ICN={
  undo:'M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3',menu:'M4 6h16M4 12h16M4 18h16',plus:'M12 5v14M5 12h14',
  cursor:'M5 3l14 8-6 2-2 6z',cable:'M3 17h4l3-10 4 10 3-5h4',fit:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',
  trash:'M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13',copy:'M8 8h11v12H8zM5 16V4h11',edit:'M4 20h4L19 9l-4-4L4 16z',
  grid:'M4 4h16v16H4zM4 12h16M12 4v16',close:'M6 6l12 12M18 6 6 18',
  wand:'M5 19 15 9M14 4v3M14 11v3M9 9H6M20 9h-3M17.5 5.5l-1.5 1.5',bolt:'M13 2 4 14h7l-1 8 9-12h-7z'
};
function ic(n){return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+ICN[n]+'"/></svg>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function hash(id){return parseInt(String(id).replace(/\D/g,''),10)||0;}

/* ---------- stato ---------- */
var KEY='schema-quadro-v1';
var store={projects:{},last:null};
try{var raw=localStorage.getItem(KEY);if(raw)store=JSON.parse(raw)||store;}catch(e){}
if(!store.projects)store.projects={};
var SIM={on:false,live:{},lit:{},msg:'',hint:''};
var EX=null;
var P=null, undo=[], view={x:40,y:60,k:1}, tool='select', sel=null, pend=null, wcol='r', wthk=4, grid=true, sheetKind=null;

function newId(){return 'p'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function nid(pfx){return pfx+(P.seq++);}
function persist(){
  if(!P)return; P.updated=Date.now(); store.projects[P.id]=P; store.last=P.id;
  try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}
}
function mk(type,x,y){
  var it={id:nid('i'),type:type,x:x,y:y,label:'',n:0,color:''};
  if(CAT[type])it.label=CAT[type].label;
  if(type==='din')it.n=12;
  if(type.indexOf('bar_')===0){it.n=12;it.label=type==='bar_n'?'N':type==='bar_pe'?'PE':'L';}
  if(type==='comb'){it.n=6;it.color='red';}
  if(type==='text'){it.text='Etichetta';it.size=16;}
  return it;
}
function exampleProject(){
  P={id:newId(),name:'Esempio (modificalo o creane uno nuovo)',items:[],wires:[],seq:1};
  var rail=mk('din',0,0);rail.n=12;
  var rcd=mk('rcd2',12,-52), a=mk('mcb1',84,-52), b=mk('mcb1',120,-52), c=mk('mcb2',156,-52);
  a.label='C10';b.label='C16';c.label='C20 2P';
  var bn=mk('bar_n',12,120);bn.n=6;var bp=mk('bar_pe',216,120);bp.n=6;
  var t1=mk('text',84,-84);t1.text='Luci';t1.size=14;
  var t2=mk('text',120,-84);t2.text='Prese';t2.size=14;
  P.items.push(rail,rcd,a,b,c,bn,bp,t1,t2);
  P.wires.push({id:nid('w'),a:{i:rcd.id,t:'b1'},b:{i:bn.id,t:'s0'},c:'b',t:4});
  persist();
}
(function init(){
  var last=store.last&&store.projects[store.last];
  if(last){P=last;}else{exampleProject();}
})();

function snapshot(){return JSON.stringify({items:P.items,wires:P.wires,seq:P.seq});}
function pushUndo(){undo.push(snapshot());if(undo.length>60)undo.shift();updateUI();}
function doUndo(){
  var s=undo.pop();if(!s)return;var d=JSON.parse(s);
  P.items=d.items;P.wires=d.wires;P.seq=d.seq;sel=null;pend=null;persist();render();updateUI();if(sheetKind==='edit')closeSheet();
}

/* ---------- geometria ---------- */
function sz(it){
  var c=CAT[it.type];if(c)return{w:c.m*MOD,h:DH};
  if(it.type==='grid')return{w:72,h:52};
  if(it.type==='load')return{w:MOD,h:76};
  if(it.type==='din')return{w:it.n*MOD+24,h:RH};
  if(it.type.indexOf('bar_')===0)return{w:it.n*28+16,h:34};
  if(it.type==='comb')return{w:it.n*MOD,h:12};
  if(it.type==='text'){var s=it.size||16;return{w:Math.max(24,(it.text||'').length*s*.6+6),h:s*1.35};}
  return{w:20,h:20};
}
function nameOf(it){
  if(CAT[it.type])return CAT[it.type].name;
  return {din:'Guida DIN',grid:'Rete 230 V',load:'Carico (lampadina)',bar_n:'Barra N',bar_pe:'Barra PE',bar_l:'Morsettiera L',comb:'Barra pettine',text:'Testo'}[it.type]||it.type;
}
function terms(it){
  var out=[],c=CAT[it.type],i;
  if(c){var w=c.m*MOD;for(i=0;i<c.p;i++){var x=it.x+(i+.5)*w/c.p;out.push({id:'t'+i,x:x,y:it.y+16,dir:-1});out.push({id:'b'+i,x:x,y:it.y+DH-16,dir:1});}}
  else if(it.type.indexOf('bar_')===0){for(i=0;i<it.n;i++)out.push({id:'s'+i,x:it.x+22+i*28,y:it.y+17,dir:0});}
  else if(it.type==='grid'){out.push({id:'b0',x:it.x+18,y:it.y+40,dir:1});out.push({id:'b1',x:it.x+54,y:it.y+40,dir:1});}
  else if(it.type==='load'){out.push({id:'t0',x:it.x+18,y:it.y+10,dir:-1});}
  return out;
}
function gt(ref){
  var it=P.items.filter(function(i){return i.id===ref.i;})[0];if(!it)return null;
  return terms(it).filter(function(t){return t.id===ref.t;})[0]||null;
}
function route(w){
  var a=gt(w.a),b=gt(w.b);if(!a||!b)return null;
  var dA=a.dir,dB=b.dir;
  if(!dA)dA=(b.y>=a.y)?1:-1;
  if(!dB)dB=(a.y>=b.y)?1:-1;
  var ln=16+(hash(w.id)%5)*6;
  var p1=[a.x,a.y+dA*ln],p2=[b.x,b.y+dB*ln],my;
  if(dA===dB)my=dA>0?Math.max(p1[1],p2[1]):Math.min(p1[1],p2[1]);else my=(p1[1]+p2[1])/2+((hash(w.id)%5)-2)*7;
  return [[a.x,a.y],p1,[p1[0],my],[p2[0],my],p2,[b.x,b.y]];
}
function rpath(pts,r){
  var q=[pts[0]],i;
  for(i=1;i<pts.length;i++){var a=q[q.length-1],b=pts[i];if(Math.abs(a[0]-b[0])>.01||Math.abs(a[1]-b[1])>.01)q.push(b);}
  if(q.length<2)return 'M'+q[0][0]+' '+q[0][1];
  var d='M'+q[0][0]+' '+q[0][1];
  for(i=1;i<q.length-1;i++){
    var p0=q[i-1],p1=q[i],p2=q[i+1];
    var l1=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]),l2=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);
    var rr=Math.min(r,l1/2,l2/2);
    var s=[p1[0]+(p0[0]-p1[0])/l1*rr,p1[1]+(p0[1]-p1[1])/l1*rr];
    var e=[p1[0]+(p2[0]-p1[0])/l2*rr,p1[1]+(p2[1]-p1[1])/l2*rr];
    d+='L'+s[0]+' '+s[1]+'Q'+p1[0]+' '+p1[1]+' '+e[0]+' '+e[1];
  }
  var z=q[q.length-1];return d+'L'+z[0]+' '+z[1];
}

function layer(it){return it.type==='din'?0:it.type==='comb'?2:it.type==='text'?4:1;}
function drawWire(w,ex){
  var pts=route(w);if(!pts)return '';
  var d=rpath(pts,9),col=WCOL[w.c]?WCOL[w.c][1]:'#d93a35',t=w.t||4,cap='stroke-linejoin:round;stroke-linecap:round;fill:none';
  var lv=!ex&&SIM.on&&SIM.live[nk(w.a.i,w.a.t)];
  var s='<g data-wid="'+w.id+'">';
  if(lv)s+='<path d="'+d+'" style="'+cap+';stroke:#ffd400;stroke-opacity:.4;stroke-width:'+(t+8)+'"/>';
  if(!ex&&sel&&sel.kind==='wire'&&sel.id===w.id)s+='<path d="'+d+'" style="'+cap+';stroke:var(--sel);stroke-opacity:.35;stroke-width:'+(t+9)+'"/>';
  s+='<path d="'+d+'" style="'+cap+';stroke:rgba(0,0,0,.38);stroke-width:'+(t+1.8)+'"/>';
  s+='<path d="'+d+'" style="'+cap+';stroke:'+col+';stroke-width:'+t+'"/>';
  if(w.c==='y')s+='<path d="'+d+'" style="fill:none;stroke:#179a3a;stroke-width:'+t+';stroke-dasharray:8 8"/>';
  if(lv)s+='<path class="flow" d="'+d+'"/>';
  if(!ex)s+='<path d="'+d+'" style="fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke"/>';
  return s+'</g>';
}
function content(ex){
  var items=P.items.slice().sort(function(a,b){return layer(a)-layer(b);}),s='',i;
  function one(it){
    var z=sz(it),g='<g data-id="'+it.id+'" transform="translate('+it.x+' '+it.y+')">'+drawIt(it);
    if(!ex&&sel&&sel.kind==='item'&&sel.id===it.id)g+='<rect x="-5" y="-5" width="'+(z.w+10)+'" height="'+(z.h+10)+'" rx="6" style="fill:none;stroke:var(--sel);stroke-width:2;stroke-dasharray:5 4;pointer-events:none"/>';
    return g+'</g>';
  }
  for(i=0;i<items.length;i++)if(layer(items[i])<4)s+=one(items[i]);
  for(i=0;i<P.wires.length;i++)s+=drawWire(P.wires[i],ex);
  for(i=0;i<items.length;i++)if(layer(items[i])===4)s+=one(items[i]);
  return s;
}
function render(){
  if(EX)exCalc();
  var s=content(false);
  if(EX&&!SIM.on)s+=exGhost();
  if(tool==='wire'){
    P.items.forEach(function(it){
      terms(it).forEach(function(t){
        var on=pend&&pend.i===it.id&&pend.t===t.id;
        s+='<circle data-ti="'+it.id+'" data-tt="'+t.id+'" cx="'+t.x+'" cy="'+t.y+'" r="'+(on?15:13)+'" style="fill:var(--sel);fill-opacity:'+(on?.55:.16)+';stroke:var(--sel);stroke-width:'+(on?2.5:1.4)+';cursor:pointer"/>';
      });
    });
  }
  $('world').innerHTML=s;
  applyView();
}
function applyView(){

  $('gp').setAttribute('patternTransform','translate('+view.x+' '+view.y+') scale('+view.k+') translate(-'+GRID/2+' -'+GRID/2+')');
  $('gr').style.display=grid?'':'none';
}

function fit(){
  var W=cw(),H=ch();
  if(!P.items.length){view={x:W/2-100,y:H/2-60,k:1};applyView();return;}
  var b=bbox(0);
  var k=clamp(Math.min(W/(b.w+60),H/(b.h+60),1.6),.2,1.6);
  view.k=k;view.x=W/2-(b.x+b.w/2)*k;view.y=H/2-(b.y+b.h/2)*k;
  applyView();
}
function bbox(pad){
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  P.items.forEach(function(it){var z=sz(it);x0=Math.min(x0,it.x);y0=Math.min(y0,it.y-14);x1=Math.max(x1,it.x+z.w);y1=Math.max(y1,it.y+z.h);});
  P.wires.forEach(function(w){var p=route(w);if(p)p.forEach(function(q){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);});});
  if(x0>x1){x0=0;y0=0;x1=100;y1=60;}
  return{x:x0-pad,y:y0-pad,w:x1-x0+2*pad,h:y1-y0+2*pad};
}
function centerOn(it){
  var z=sz(it),W=cw(),H=ch(),fy=sheetKind?.3:.5;
  var sx=view.x+(it.x+z.w/2)*view.k,sy=view.y+(it.y+z.h/2)*view.k;
  if(sx<40||sx>W-40||sy<40||sy>H*(sheetKind?.55:1)-40){
    view.x=W/2-(it.x+z.w/2)*view.k;view.y=H*fy-(it.y+z.h/2)*view.k;applyView();
  }
}

/* ---------- aggiunta e modifica ---------- */
function snapG(v){return grid?Math.round(v/GRID)*GRID:v;}
function snapToRail(it){
  if(!CAT[it.type])return false;
  var z=sz(it),cx=it.x+z.w/2,best=null;
  P.items.forEach(function(r){
    if(r.type!=='din')return;var rw=r.n*MOD+24;
    if(cx>=r.x-20&&cx<=r.x+rw+20){var dy=Math.abs(it.y+z.h/2-(r.y+RH/2));if(dy<80&&(!best||dy<best.dy))best={r:r,dy:dy};}
  });
  if(!best)return false;
  var r=best.r;it.y=r.y+RH/2-z.h/2;it.x=r.x+12+Math.round((it.x-(r.x+12))/MOD)*MOD;return true;
}
function autoPlace(it){
  var z=sz(it),W=cw(),H=ch();
  var wc={x:(W/2-view.x)/view.k,y:((sheetKind?H*.3:H/2)-view.y)/view.k};
  if(CAT[it.type]){
    var rails=P.items.filter(function(r){return r.type==='din';}).sort(function(a,b){return Math.abs(a.y-wc.y)-Math.abs(b.y-wc.y);});
    for(var ri=0;ri<rails.length;ri++){
      var r=rails[ri],rw=r.n*MOD+24,y=r.y+RH/2-z.h/2;
      for(var x=r.x+12;x+z.w<=r.x+rw-12+.1;x+=MOD){
        var clash=P.items.some(function(o){
          if(!CAT[o.type]||o.id===it.id)return false;var oz=sz(o);
          return Math.abs(o.y-y)<20&&x<o.x+oz.w&&x+z.w>o.x;
        });
        if(!clash){it.x=x;it.y=y;return;}
      }
    }
  }
  it.x=snapG(wc.x-z.w/2);it.y=snapG(wc.y-z.h/2);
}

var ptrs=new Map(),drag=null,pinch=null;
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();

    var v=Array.from(ptrs.values()),a=v[0],b=v[1];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,v:{x:view.x,y:view.y,k:view.k}};drag=null;return;
  }
  var t=e.target,term=t.closest?t.closest('[data-tt]'):null,ig=t.closest?t.closest('[data-id]'):null,wg=t.closest?t.closest('[data-wid]'):null;
  drag={sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:false,term:term,it:ig?find(ig.dataset.id):null,wire:wg?wg.dataset.wid:null,mode:'pan',px:0,py:0,riders:[]};

    }
  }
});
cv.addEventListener('pointermove',function(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){
    var v=Array.from(ptrs.values()),a=v[0],b=v[1],d=Math.hypot(a.x-b.x,a.y-b.y)||1,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,r=cv.getBoundingClientRect();
    var k=clamp(pinch.v.k*d/pinch.d,.15,3),wx=(pinch.cx-r.left-pinch.v.x)/pinch.v.k,wy=(pinch.cy-r.top-pinch.v.y)/pinch.v.k;
    view.k=k;view.x=cx-r.left-wx*k;view.y=cy-r.top-wy*k;applyView();return;
  }
  if(!drag)return;
  var dx=e.clientX-drag.lx,dy=e.clientY-drag.ly;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
    drag.moved=true;
    if(drag.mode==='item'){pushUndo();sel={kind:'item',id:drag.it.id};updateUI();}
  }
  drag.lx=e.clientX;drag.ly=e.clientY;
  if(drag.mode==='pan'){view.x+=dx;view.y+=dy;applyView();}
  else{
    drag.px+=dx/view.k;drag.py+=dy/view.k;
    var it=drag.it;it.x=snapG(drag.ox+drag.px);it.y=snapG(drag.oy+drag.py);
    drag.riders.forEach(function(q){q.it.x=q.ox+(it.x-drag.ox);q.it.y=q.oy+(it.y-drag.oy);});

});
function endPtr(e){

/* ---------- prova (simulazione) ---------- */
function nk(i,t){return i+':'+t;}
var TOG={mcb:1,rcd:1,rcbo:1,iso:1,cont:1,relay:1};
function isTog(it){var c=CAT[it.type];return !!(c&&TOG[c.kind]);}
function lk(o,a,b){(o[a]||(o[a]=[])).push(b);(o[b]||(o[b]=[])).push(a);}
function bfs(adj,starts){
  var seen={},q=starts.slice(),k;
  starts.forEach(function(s){seen[s]=1;});
  while(q.length){k=q.pop();(adj[k]||[]).forEach(function(n){if(!seen[n]){seen[n]=1;q.push(n);}});}
  return seen;
}
function staticGraph(){
  var st={};
  P.wires.forEach(function(w){lk(st,nk(w.a.i,w.a.t),nk(w.b.i,w.b.t));});
  P.items.forEach(function(it){
    var i;
    if(it.type.indexOf('bar_')===0)for(i=1;i<it.n;i++)lk(st,nk(it.id,'s'+(i-1)),nk(it.id,'s'+i));
    if(it.type==='comb'){
      var z=sz(it),ks=[];
      P.items.forEach(function(o){
        if(!CAT[o.type])return;
        terms(o).forEach(function(t){if(t.id==='t0'&&t.x>=it.x&&t.x<=it.x+z.w&&t.y>=it.y-8&&t.y<=it.y+z.h+8)ks.push(nk(o.id,t.id));});
      });
      for(i=1;i<ks.length;i++)lk(st,ks[0],ks[i]);
    }
  });
  return st;
}
function dynGraph(st){
  var d={},k;
  for(k in st)d[k]=st[k].slice();
  P.items.forEach(function(it){
    var c=CAT[it.type];if(!c||c.kind==='spd'||c.kind==='lamp')return;
    if(isTog(it)&&it.off)return;
    for(var i=0;i<c.p;i++)lk(d,nk(it.id,'t'+i),nk(it.id,'b'+i));
  });
  return d;
}
function hasB(o,G){return terms(o).some(function(t){return t.id[0]==='b'&&G[nk(o.id,t.id)];});}
function devName(o){return nameOf(o)+(o.label?' '+o.label:'');}
function simRun(){
  var st=staticGraph(),msgs=[],iter=0,changed,live={};
  var grids=P.items.filter(function(i){return i.type==='grid';});
  var loads=P.items.filter(function(i){return i.type==='load';});
  do{
    changed=false;
    live=bfs(dynGraph(st),grids.map(function(g){return nk(g.id,'b0');}));
    loads.forEach(function(l){
      if(!l.fault||!live[nk(l.id,'t0')])return;
      var G=bfs(st,[nk(l.id,'t0')]),cand=[];
      var prot=P.items.filter(function(o){var c=CAT[o.type];return c&&(c.kind==='mcb'||c.kind==='rcbo')&&!o.off&&hasB(o,G);});
      if(l.fault==='corto')cand=prot;
      else{
        P.items.forEach(function(o){var c=CAT[o.type];if(c&&(c.kind==='rcd'||c.kind==='rcbo')&&!o.off&&hasB(o,G))cand.push(o);});
        prot.forEach(function(m){
          var G2=bfs(st,[nk(m.id,'t0')]);
          P.items.forEach(function(o){var c=CAT[o.type];if(c&&(c.kind==='rcd'||c.kind==='rcbo')&&!o.off&&cand.indexOf(o)<0&&hasB(o,G2))cand.push(o);});
        });
      }
      cand.forEach(function(o){o.off=true;changed=true;msgs.push('È scattato '+devName(o)+(l.fault==='corto'?' (corto circuito)':' (dispersione verso terra)')+'. Riarmalo con un tocco.');});
    });
    iter++;
  }while(changed&&iter<8);
  var lit={};
  loads.forEach(function(l){lit[l.id]=!!live[nk(l.id,'t0')]&&!l.fault;});
  SIM.live=live;SIM.lit=lit;SIM.msg=msgs.join(' ');
  var hint='';
  if(!grids.length)hint='Manca la Rete 230 V: aggiungila da Aggiungi → Alimentazione e carichi e collegala al generale.';
  else if(!loads.length)hint='Nessun carico: aggiungi una lampadina e collegala all\'uscita di un magnetotermico per vedere se si accende.';
  else if(loads.some(function(l){return l.fault&&live[nk(l.id,'t0')];}))hint='Nessuna protezione ha interrotto il guasto: su questa linea manca un magnetotermico o un differenziale.';
  SIM.hint=hint;
  persist();
}

function simTap(d){

var TOL=24;

    load:['Aggiungi un carico','La lampadina rappresenta ciò che la linea alimenta: serve a provare il quadro.']

function exBuildSteps(sol){
  var byId={},its=sol.items.filter(function(i){return i.type!=='text';}),steps,pos={};
  sol.items.forEach(function(i){byId[i.id]=i;});
  function pr(t){return t==='din'?0:t==='grid'?1:2;}
  its.sort(function(a,b){return pr(a.type)-pr(b.type)||exNum(a.id)-exNum(b.id);});
  its.forEach(function(it,ix){pos[it.id]=ix;});
  steps=its.map(function(it){return {kind:'item',item:it,p:pos[it.id]};});
  sol.wires.forEach(function(w){steps.push({kind:'wire',wire:w,p:Math.max(pos[w.a.i],pos[w.b.i])+.5});});
  steps.sort(function(a,b){return a.p-b.p;});
  steps.forEach(function(st){var r=exInfo(st,byId);st.title=r[0];st.text=r[1];});
  return steps;
}
function exStart(mode,level){
  var sol=JSON.parse(JSON.stringify(P)),drop={};
  var L={id:newId(),name:'Esercizio: '+sol.name,items:[],wires:[],seq:sol.seq};
  var texts=sol.items.filter(function(i){return i.type==='text';});

    if(level===3)its.forEach(function(i){if(i.type!=='din')drop[i.id]=1;});
    L.items=sol.items.filter(function(i){return !drop[i.id];});

  }

function exFit(){
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  EX.sol.items.forEach(function(it){var z=sz(it);x0=Math.min(x0,it.x);y0=Math.min(y0,it.y);x1=Math.max(x1,it.x+z.w);y1=Math.max(y1,it.y+z.h);});
  var vw=cw(),vh=ch(),bw=x1-x0,bh=y1-y0,k=clamp(Math.min(vw/(bw+60),vh/(bh+60),1.4),.12,1.4);
  view.k=k;view.x=vw/2-(x0+bw/2)*k;view.y=vh/2-(y0+bh/2)*k;applyView();
}
function exCalc(){
  var used={},map={},learn=P.items.filter(function(i){return i.type!=='text';});
  EX.steps.forEach(function(st){
    st.done=false;
    if(st.kind!=='item')return;
    var s=st.item,best=null;
    learn.forEach(function(l){
      if(used[l.id]||l.type!==s.type)return;
      if(s.type==='din'&&l.n<s.n)return;
      var d=Math.max(Math.abs(l.x-s.x),Math.abs(l.y-s.y));
      if(d<=TOL&&(!best||d<best.d))best={l:l,d:d};
    });
    if(best){used[best.l.id]=1;map[s.id]=best.l.id;st.done=true;st.li=best.l;}
  });
  EX.steps.forEach(function(st){
    if(st.kind!=='wire')return;
    var w=st.wire,a=map[w.a.i],b=map[w.b.i];st.lw=null;
    if(!a||!b)return;
    P.wires.some(function(x){
      if((x.a.i===a&&x.a.t===w.a.t&&x.b.i===b&&x.b.t===w.b.t)||(x.b.i===a&&x.b.t===w.a.t&&x.a.i===b&&x.a.t===w.b.t)){st.lw=x;return true;}
      return false;
    });
    st.done=!!st.lw;
  });
  EX.map=map;
  EX.cur=null;
  for(var i=0;i<EX.steps.length;i++)if(!EX.steps[i].done){EX.cur=EX.steps[i];break;}
  EX.finished=!EX.cur&&EX.steps.length>0;
  if(EX.finished&&EX.mode==='steps'&&!EX.textsAdded){
    EX.textsAdded=true;
    EX.texts.forEach(function(t){P.items.push(JSON.parse(JSON.stringify(t)));});
    persist();
  }
}
function exGhost(){
  var st=EX.cur;

  var out='';
  if(st.kind==='item'){

    out+='<g transform="translate('+s.x+' '+s.y+')" style="opacity:.4;pointer-events:none">'+drawIt(s)+'</g><rect x="'+(s.x-4)+'" y="'+(s.y-4)+'" width="'+(z.w+8)+'" height="'+(z.h+8)+'" rx="6" style="fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;pointer-events:none"/>';
  }else{
    var w=st.wire,a={i:EX.map[w.a.i],t:w.a.t},b={i:EX.map[w.b.i],t:w.b.t};
    out+='<g style="opacity:.45;pointer-events:none">'+drawWire({id:w.id,a:a,b:b,c:w.c,t:w.t},true)+'</g>';

}
function exMagnet(it){

    var g=groupLines(W.lines),n=0;
    h+='<p class="hint">Controlla le linee. Puoi cambiare il nome e il calibro: la sezione del cavo si adegua da sola.</p>';
    h+='<h3>Cosa vuoi fare</h3><div class="seg">'+[['make','Crea il quadro'],['steps','Passo passo'],['fill','Completa il disegno']].map(function(m){return '<button class="btn'+(W.mode===m[0]?' on':'')+'" data-wm="'+m[0]+'">'+m[1]+'</button>';}).join('')+'</div>';
    if(W.mode==='steps')h+='<p class="hint">Ti guido a costruire il quadro pezzo per pezzo, con un\'ombra che indica dove mettere ogni pezzo e una spiegazione di cosa fa. Per un primo esercizio scegli poche linee: torna ai passi 2 e 3.</p>';
    if(W.mode==='fill')h+='<div class="seg">'+[[1,'Facile'],[2,'Medio'],[3,'Difficile']].map(function(m){return '<button class="btn'+(W.level===m[0]?' on':'')+'" data-wl="'+m[0]+'">'+m[1]+'</button>';}).join('')+'</div><p class="hint">'+['Facile: mancano solo alcuni magnetotermici e i loro cavi.','Medio: ci sono tutti i pezzi, ma mancano tutti i cavi.','Difficile: ci sono solo le guide DIN, il resto lo metti tu.'][W.level-1]+' Le etichette restano come promemoria.</p>';
    g.forEach(function(grp,gi){
      h+='<h3>Differenziale '+(gi+1)+' · '+RCDL[W.kw]+'</h3>';
      grp.forEach(function(l){
        n++;
        h+='<div class="lr"><span class="num">'+n+'</span><input class="inp" data-ln="'+l.idx+'" value="'+esc(l.name)+'" aria-label="Nome linea '+n+'"><select class="inp sel" data-la="'+l.idx+'" aria-label="Calibro linea '+n+'">'+[6,10,16,20,25,32,40].map(function(a){return '<option value="'+a+'"'+(a===l.amp?' selected':'')+'>C'+a+'</option>';}).join('')+'</select><span class="cab">'+fmt(CAB[l.amp])+' mm²</span></div>';
      });
    });
    h+='<div class="note"><b>Interruttore generale '+GEN[W.kw]+'</b> per un contratto da '+fmt(W.kw)+' kW. Il quadro che crei è una bozza di partenza: portate, sezioni dei cavi, selettività e conformità alla CEI 64-8 vanno verificate da un elettricista abilitato prima di realizzare l\'impianto. Nel disegno ci sono i collegamenti principali (generale, differenziali e fase delle linee); i collegamenti del neutro e della terra con le barre restano da tracciare a mano.</div>';
  }
  h+='</div><div class="wz-f">'+(s>1?'<button class="btn" data-w="back">Indietro</button>':'<span></span>')+(s<5?'<button class="btn on" data-w="next">Avanti</button>':'<button class="btn on" data-w="make">'+(W.mode==='make'?'Crea il quadro':'Inizia l\'esercizio')+'</button>')+'</div></div>';
  o.innerHTML=h;W.last=s;
  var nb=o.querySelector('.wz-b');if(nb)nb.scrollTop=st;
}
$('wiz').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||!W)return;
  var d=b.dataset;
  if(d.w==='x'){wizClose();return;}
  if(d.w==='back'){W.step=Math.max(1,W.step-1);}
  else if(d.w==='next'){
    if(W.step===1&&W.mq!==W.mqSet){W.mqSet=W.mq;W.lights=W.mq<60?1:W.mq<110?2:3;W.sockets=W.mq<60?2:W.mq<110?3:4;}
    if(W.step===4)W.lines=buildLines();
    W.step=Math.min(5,W.step+1);
  }
  else if(d.w==='make'){genBoard();return;}
  else if(d.wm){W.mode=d.wm;}
  else if(d.wl){W.level=parseInt(d.wl,10);}
  else if(d.kw){W.kw=parseFloat(d.kw);}
  else if(d.tg){W[d.tg]=d.v==='1';}
  else if(d.ws){
    var dd=parseInt(d.d,10),k=d.ws;
    if(STEP[k]){var q=STEP[k];W[k]=clamp(W[k]+dd*q[2],q[0],q[1]);}
    else W.ded[k]=clamp((W.ded[k]||0)+dd,0,DEDMAX[k]);
  }
  wizRender();
});
$('wiz').addEventListener('input',function(e){
  var t=e.target;if(t.dataset&&t.dataset.ln!==undefined&&W&&W.lines)W.lines[parseInt(t.dataset.ln,10)].name=t.value;
});
$('wiz').addEventListener('change',function(e){
  var t=e.target;if(t.dataset&&t.dataset.la!==undefined&&W&&W.lines){W.lines[parseInt(t.dataset.la,10)].amp=parseInt(t.value,10);wizRender();}
});
function genBoard(){
  var grp=groupLines(W.lines);
  P={id:newId(),name:'Quadro '+W.mq+' m²',items:[],wires:[],seq:1};
  var Y0=0,Y1=260,Y2=590,num=0;
  function add(type,x,y,props){var it=mk(type,x,y),k;for(k in props)it[k]=props[k];P.items.push(it);return it;}
  function wire(a,at,b,bt,c){P.wires.push({id:nid('w'),a:{i:a.id,t:at},b:{i:b.id,t:bt},c:c,t:4});}
  var G=[],gx=0;
  grp.forEach(function(g){
    var c=g.length,railW=(c+2)*MOD+24,barW=Math.max(4,c+2)*28+60,w=Math.max(railW,barW,260)+40;
    G.push({x:gx,lines:g,w:w});gx+=w;
  });
  var gm=2+(W.spd?2:0)+(W.lamp?1:0);
  add('din',0,Y0,{n:Math.max(4,gm+1)});
  var gen=add('mcb2',12,Y0-52,{label:GEN[W.kw]}),cx=12+2*MOD;
  var net=add('grid',12,Y0-190,{});
  wire(net,'b0',gen,'t0','m');wire(net,'b1',gen,'t1','b');
  add('text',60,Y0-78,{text:'Generale '+fmt(W.kw)+' kW',size:13});
  if(W.spd){add('spd',cx,Y0-52,{});cx+=2*MOD;}
  if(W.lamp){var lp=add('lamp',cx,Y0-52,{label:''});wire(net,'b0',lp,'t0','m');}
  add('din',0,Y1,{n:Math.max(4,Math.ceil((G[G.length-1].x+72)/MOD))});
  G.forEach(function(g,gi){
    var c=g.lines.length,rcd=add('rcd2',g.x+12,Y1-52,{label:RCDL[W.kw]});
    add('text',g.x+12,Y1-78,{text:'Differenziale '+(gi+1),size:13});
    add('din',g.x,Y2,{n:c+2});
    add('comb',g.x+12,Y2-42,{n:c,color:'red'});
    var bn=add('bar_n',g.x+44,Y1+118,{n:Math.max(4,c+2),label:'N'});
    add('bar_pe',g.x+44,Y1+170,{n:Math.max(4,c+2),label:'PE'});
    var first=null;
    g.lines.forEach(function(l,li){
      num++;
      var m=add('mcb1',g.x+12+li*MOD,Y2-52,{label:'C'+l.amp});
      if(!li)first=m;
      var tw=String(num).length*13*.6+6;
      var ld=add('load',g.x+12+li*MOD,Y2+150,{});
      wire(m,'b0',ld,'t0','m');
      add('text',g.x+12+li*MOD+(MOD-tw)/2,Y2+232,{text:String(num),size:13});
      add('text',g.x+12,Y2+262+li*18,{text:num+' · '+l.name+' — C'+l.amp+' · '+fmt(CAB[l.amp])+' mm²',size:12});
    });
    wire(gen,'b0',rcd,'t0','m');
    wire(gen,'b1',rcd,'t1','b');
    wire(rcd,'b0',first,'t0','m');
    wire(rcd,'b1',bn,'s0','b');
  });
  wizClose();
  if(W.mode==='steps'||W.mode==='fill'){exStart(W.mode,W.level||1);return;}
  loadProject(P);
  toast('Quadro creato: modificalo come vuoi');
}

render();updateUI();
requestAnimationFrame(function(){fit();});
window.addEventListener('resize',function(){applyView();});
document.addEventListener('keydown',function(e){
  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
  if((e.key==='Delete'||e.key==='Backspace')&&sel){delSel();}
  if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();doUndo();}
});
})();
